name: Sync Upstream

on:
  schedule:
    # Run every morning at 06:00 UTC (1:00 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Anil-matcha/awesome-generative-ai-apps.git || true
          git fetch upstream main

      - name: Merge upstream changes
        run: |
          git checkout main
          git merge upstream/main -m "chore(sync): automated upstream sync from Anil-matcha/awesome-generative-ai-apps" || git merge --abort
          git push origin main || echo "No changes to push or push completed"
